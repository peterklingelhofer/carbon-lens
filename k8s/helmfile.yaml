repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

environments:
  default:
    values:
      - environments/default.yaml
  staging:
    values:
      - environments/staging.yaml
  production:
    values:
      - environments/production.yaml

releases:
  - name: carbonlens-db
    namespace: carbonlens
    chart: bitnami/postgresql
    version: "16.*"
    condition: database.bundled.enabled
    values:
      - auth:
          postgresPassword: {{ .Values | get "database.bundled.auth.postgresPassword" "carbonlens" | quote }}
          database: {{ .Values | get "database.bundled.auth.database" "carbonlens" | quote }}
        primary:
          persistence:
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi

  - name: carbonlens
    namespace: carbonlens
    chart: ./helm/carbonlens
    needs:
      - carbonlens/carbonlens-db
    values:
      - helm/carbonlens/values.yaml
      - database:
          enabled: true
          url: postgresql+asyncpg://postgres:{{ .Values | get "database.bundled.auth.postgresPassword" "carbonlens" }}@carbonlens-db-postgresql:5432/{{ .Values | get "database.bundled.auth.database" "carbonlens" }}
    secrets:
      - secrets.yaml
